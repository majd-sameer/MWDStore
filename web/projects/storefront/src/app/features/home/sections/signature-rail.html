
    @if (products().length) {
      <section class="sig">
        <div class="sig-head">
          <div>
            <div class="sig-eyebrow">{{ 'home.signature.eyebrow' | translate }}</div>
            <h2 class="sig-title">{{ 'home.signature.title' | translate }}</h2>
          </div>
          <a class="sig-all" routerLink="/shop">
            {{ 'home.view_all' | translate }}
            <lib-icon name="arrowEnd" [size]="16" />
          </a>
        </div>

        <div class="row row-cols-2 row-cols-md-4 g-4">
          @for (product of products(); track product.id) {
            <div class="col">
              <app-product-card-signature [product]="product" (addToCart)="addToCart.emit($event)" />
            </div>
          }
        </div>
      </section>
    }
