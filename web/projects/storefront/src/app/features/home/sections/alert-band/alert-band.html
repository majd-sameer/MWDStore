
    @if (visible().length) {
      <div class="band" role="region" [attr.aria-label]="'home.alerts.label' | translate">
        <div class="wrap">
          <ul class="rows">
            @for (a of visible(); track a.id) {
              <li class="row">
                <span class="pill" aria-hidden="true">
                  <lib-icon name="spark" [size]="14" />
                  {{ 'home.alerts.badge' | translate }}
                </span>

                @if (a.alertCtaUrl && isExternal(a.alertCtaUrl)) {
                  <a class="msg" [href]="a.alertCtaUrl" target="_blank" rel="noopener noreferrer">
                    <span class="msg-title">{{ a.name }}</span>
                    @if (a.shortContent) {
                      <span class="msg-sub">{{ a.shortContent }}</span>
                    }
                  </a>
                } @else {
                  <a class="msg" [routerLink]="routeTarget(a)">
                    <span class="msg-title">{{ a.name }}</span>
                    @if (a.shortContent) {
                      <span class="msg-sub">{{ a.shortContent }}</span>
                    }
                  </a>
                }

                <button
                  type="button"
                  class="dismiss"
                  (click)="dismiss(a)"
                  [attr.aria-label]="'home.alerts.dismiss' | translate"
                >
                  <lib-icon name="x" [size]="16" />
                </button>
              </li>
            }
          </ul>
        </div>
      </div>
    }
