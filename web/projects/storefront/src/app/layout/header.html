    <div class="announce">
      {{ 'announce' | translate }}
    </div>

    <header class="site-header">
      <div class="wrap header-bar">
        <a routerLink="/" class="wordmark" aria-label="MadeWithDetermination">
          <img class="wordmark-logo d-none d-lg-block" src="logo-gold.png" alt="" />
          <img class="wordmark-logo d-lg-none" src="logo-color.png" alt="" />
          <span class="wordmark-text">{{ 'brand.name' | translate }}</span>
        </a>

        <!-- Desktop only: below lg the bottom tab bar (layout/bottom-nav) carries
             navigation, cart, account and language, so the header is the logo alone. -->
        <nav class="primary-nav d-none d-lg-flex" [attr.aria-label]="'nav.menu' | translate">
          @for (link of mainLinks; track link.key) {
            <a
              class="nav-link"
              [routerLink]="link.link"
              [queryParams]="link.queryParams ?? null"
              routerLinkActive="active"
              [routerLinkActiveOptions]="{ exact: true }"
              >{{ 'nav.' + link.key | translate }}</a
            >
          }
        </nav>

        <div class="header-actions d-none d-lg-flex">
          <app-language-switcher />
          <a
            class="icon-btn"
            [routerLink]="auth.isAuthenticated() ? '/account' : '/login'"
            [attr.aria-label]="'nav.account' | translate"
          >
            <lib-icon name="user" [size]="20" />
          </a>
          <a
            class="icon-btn"
            routerLink="/track-order"
            [attr.aria-label]="'nav.track' | translate"
            [attr.title]="'nav.track' | translate"
          >
            <lib-icon name="box" [size]="20" />
          </a>
          <button
            type="button"
            class="icon-btn cart-btn"
            [attr.aria-label]="'nav.cart' | translate"
            (click)="cartDrawer.show()"
          >
            <lib-icon name="bag" [size]="20" />
            <span class="cart-label">{{ 'nav.cart' | translate }}</span>
            @if (cart.count(); as count) {
              <span class="cart-count" [class.is-bump]="bump()">{{ count }}</span>
            }
          </button>
        </div>
      </div>
    </header>
