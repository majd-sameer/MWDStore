
    <nav class="mb-3" aria-label="breadcrumb">
      <a routerLink="/taxes" class="text-decoration-none">← {{ 'taxes.title' | translate }}</a>
    </nav>
    <app-page-header [title]="(isNew() ? 'taxes.new_title' : 'taxes.edit_title') | translate" />

    @if (!isNew() && rates.isLoading()) {
      <div class="text-center py-5">
        <div class="spinner-border text-primary" role="status">
          <span class="visually-hidden">{{ 'common.loading' | translate }}</span>
        </div>
      </div>
    } @else if (!isNew() && rates.error()) {
      <div class="alert alert-danger">{{ 'taxes.load_one_failed' | translate }}</div>
    } @else {
      <div class="row g-4">
        <div class="col-lg-7">
          <div class="card border-0 shadow-sm">
            <div class="card-body">
              <div class="mb-3">
                <label class="form-label" for="rate-class">{{ 'taxes.tax_class' | translate }}</label>
                <ng-select
                  id="rate-class"
                  [items]="classItems()"
                  bindLabel="name"
                  bindValue="id"
                  [ngModel]="model().taxClassId"
                  (ngModelChange)="patch({ taxClassId: $event })"
                  [placeholder]="'common.choose' | translate" />
              </div>
              <div class="row">
                <div class="col-md-6 mb-3">
                  <label class="form-label" for="rate-country">{{ 'common.country' | translate }}</label>
                  <ng-select
                    id="rate-country"
                    [items]="countries.value() ?? []"
                    bindLabel="name"
                    bindValue="id"
                    [ngModel]="model().countryId"
                    (ngModelChange)="onCountryChange($event ?? '')"
                    [placeholder]="'common.any' | translate" />
                </div>
                <div class="col-md-6 mb-3">
                  <label class="form-label" for="rate-state">{{ 'common.state' | translate }}</label>
                  <ng-select
                    id="rate-state"
                    [items]="stateItems()"
                    bindLabel="name"
                    bindValue="id"
                    [ngModel]="model().stateOrProvinceId"
                    (ngModelChange)="patch({ stateOrProvinceId: $event })"
                    [placeholder]="'common.any' | translate" />
                </div>
              </div>
              <div class="row">
                <div class="col-md-6 mb-3">
                  <label class="form-label" for="rate-zip">{{ 'common.zip' | translate }}</label>
                  <input id="rate-zip" type="text" class="form-control"
                    [value]="model().zipCode"
                    (input)="patch({ zipCode: $any($event.target).value })" />
                </div>
                <div class="col-md-6 mb-3">
                  <label class="form-label" for="rate-rate">{{ 'taxes.col_rate' | translate }}</label>
                  <input id="rate-rate" type="number" step="0.01" class="form-control"
                    [value]="model().rate"
                    (input)="patch({ rate: $any($event.target).value })" />
                </div>
              </div>

              <div class="form-actions">
                <button type="button" libButton variant="primary" [disabled]="saving()" (click)="save()">
                  {{ (saving() ? 'common.saving' : isNew() ? 'taxes.create' : 'common.save_changes') | translate }}
                </button>
                <a routerLink="/taxes" class="btn btn-outline-secondary">{{ 'common.cancel' | translate }}</a>
              </div>
            </div>
          </div>
        </div>
      </div>
    }
