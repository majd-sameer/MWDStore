
    <div class="offcanvas-header border-bottom">
      <h2 class="offcanvas-title h5 mb-0" id="attribute-panel-title">
        {{ (isNew() ? 'attributes.new_title' : 'attributes.edit_title') | translate }}
      </h2>
      <button
        type="button"
        class="action-btn"
        [title]="'common.close' | translate"
        (click)="onCancel()"
      >
        <lib-icon name="x" [size]="16" [label]="'common.close' | translate" />
      </button>
    </div>

    <div class="offcanvas-body">
      @if (serverError(); as message) {
        <div class="alert alert-danger" role="alert">{{ message }}</div>
      }
      <form (submit)="onSubmit($event)" novalidate>
        <lib-form-field [label]="'common.name' | translate" controlId="attr-name" [required]="true" [error]="err(f.name.ar())">
          <multi-lang-input controlId="attr-name" [formField]="f.name" />
        </lib-form-field>
        <lib-form-field [label]="'attributes.col_group' | translate" controlId="attr-group" [required]="true" [error]="err(f.groupId())">
          <ng-select
            id="attr-group"
            [class.is-invalid]="!!err(f.groupId())"
            [items]="groupItems()"
            bindLabel="name"
            bindValue="id"
            [formField]="f.groupId"
            [placeholder]="'attributes.choose_group' | translate"
          />
        </lib-form-field>

        <div class="form-actions">
          <button libButton variant="primary" [disabled]="f().submitting()">
            {{ (f().submitting() ? 'common.saving' : isNew() ? 'attributes.create' : 'common.save_changes') | translate }}
          </button>
          <button type="button" class="btn btn-outline-secondary" (click)="onCancel()">
            {{ 'common.cancel' | translate }}
          </button>
        </div>
      </form>
    </div>
