
    @if (label()) {
      <label class="form-label" [attr.for]="controlId()">
        {{ label() }}
        @if (required()) {
          <span class="text-danger" aria-hidden="true">*</span>
        }
      </label>
    }
    <ng-content />
    @if (error()) {
      <div class="invalid-feedback d-block">{{ error() }}</div>
    } @else if (hint()) {
      <div class="form-text">{{ hint() }}</div>
    }
